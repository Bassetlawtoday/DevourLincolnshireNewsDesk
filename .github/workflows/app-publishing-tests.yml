name: App Publishing tests

on:
  push:
    branches:
      - feature/devour-app-publishing-v1
  pull_request:
    paths:
      - 'newsdesk/app_publishing/**'
      - 'modules/app_publishing.py'
      - 'tests/test_app_publishing_*.py'

jobs:
  app-publishing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest customtkinter
      - name: Compile changed Python modules
        run: python -m compileall -q newsdesk/app_publishing modules/app_publishing.py
      - name: Run isolated App Publishing tests
        run: python -m pytest -q tests/test_app_publishing_store.py tests/test_app_publishing_intake.py tests/test_app_publishing_areas.py
